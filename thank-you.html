<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Thank You | Residential Finishes</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--cream:#F5F0E8;--charcoal:#1C1C1E;--gold:#C9A84C;--deep-navy:#1A2332;}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,var(--deep-navy),var(--charcoal));font-family:'DM Sans',sans-serif;color:var(--cream);padding:24px}
.card{max-width:720px;background:rgba(250,250,247,.06);border:1px solid rgba(201,168,76,.25);padding:48px 34px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.logo{font-family:'Playfair Display',serif;font-weight:900;font-size:1.5rem;margin-bottom:24px}.logo span{color:var(--gold)}
h1{font-family:'Playfair Display',serif;font-size:clamp(2.2rem,6vw,4rem);line-height:1.05;margin-bottom:18px;color:var(--cream)}
p{color:rgba(245,240,232,.75);font-size:1.05rem;line-height:1.7;margin-bottom:28px}
a{display:inline-block;background:var(--gold);color:var(--charcoal);padding:15px 28px;text-decoration:none;text-transform:uppercase;font-weight:800;letter-spacing:.8px}
</style>
</head>
<body>
  <main class="card">
    <div class="logo">Residential <span>Finishes</span></div>
    <h1>Thank You</h1>
    <p>Your information was submitted successfully. The Residential Finishes team will review it and follow up as soon as possible.</p>
    <a href="/">Back to Website</a>
  </main>
</body>
</html>
